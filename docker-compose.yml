services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_lab
    ports:
      - "5433:5432"
    volumes:
      - ./migrations/001_create_chunks.sql:/docker-entrypoint-initdb.d/001_create_chunks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_lab"]
      interval: 2s
      timeout: 5s
      retries: 20
